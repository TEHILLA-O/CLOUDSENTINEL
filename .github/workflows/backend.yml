name: backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install services
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/analysis-api[test]" -e "apps/control-plane[test]" -e "apps/routing-gateway" pyyaml
      - name: Unit, integration, and reliability tests
        run: python -m pytest -q --ignore=tests/kubernetes
