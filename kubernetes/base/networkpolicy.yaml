apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analysis-api
  labels:
    app.kubernetes.io/name: analysis-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: analysis-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: routing-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
