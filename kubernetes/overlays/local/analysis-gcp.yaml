apiVersion: v1
kind: ServiceAccount
metadata:
  name: analysis-gcp
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: analysis-gcp
  labels:
    app.kubernetes.io/name: analysis-gcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: analysis-gcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-gcp
  labels:
    app.kubernetes.io/name: analysis-gcp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analysis-gcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analysis-gcp
    spec:
      serviceAccountName: analysis-gcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analysis-api
          image: cloudsentinel-analysis:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENVIRONMENT_NAME
              value: gcp-dev
            - name: ENVIRONMENT_PROVIDER
              value: kind
            - name: ANALYSIS_BACKEND
              value: deterministic
            - name: FAULT_INJECTION_ENABLED
              value: "true"
            - name: FAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudsentinel-local
                  key: FAULT_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
