apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analysis-azure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: analysis-azure
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: routing-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
