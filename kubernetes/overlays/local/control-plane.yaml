apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      serviceAccountName: control-plane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: cloudsentinel-control-plane:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudsentinel-local
                  key: DATABASE_URL
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudsentinel-local
                  key: ADMIN_TOKEN
            - name: READER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudsentinel-local
                  key: READER_TOKEN
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudsentinel-local
                  key: GATEWAY_TOKEN
            - name: FAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudsentinel-local
                  key: FAULT_TOKEN
            - name: ANALYSIS_AZURE_URL
              value: http://analysis-azure:8000
            - name: ANALYSIS_GCP_URL
              value: http://analysis-gcp:8000
            - name: PUBLIC_GATEWAY_URL
              value: http://127.0.0.1:8081
            - name: CORS_ORIGINS
              value: http://localhost:5173,http://127.0.0.1:5173
            - name: KUBECTL_RESTART_ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
