apiVersion: v1
kind: ServiceAccount
metadata:
  name: routing-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: routing-gateway
  labels:
    app.kubernetes.io/name: routing-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: routing-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-gateway
  labels:
    app.kubernetes.io/name: routing-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routing-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routing-gateway
    spec:
      serviceAccountName: routing-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: routing-gateway
          image: cloudsentinel-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONTROL_PLANE_URL
              value: http://control-plane:8000
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudsentinel-local
                  key: GATEWAY_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
