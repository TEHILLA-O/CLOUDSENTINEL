apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudsentinel
resources:
  - namespace.yaml
  - postgres.yaml
  - analysis-azure.yaml
  - analysis-gcp.yaml
  - control-plane.yaml
  - gateway.yaml
  - networkpolicy.yaml
  - rbac.yaml
secretGenerator:
  - name: cloudsentinel-local
    literals:
      - ADMIN_TOKEN=dev-admin-token
      - READER_TOKEN=dev-reader-token
      - GATEWAY_TOKEN=dev-gateway-token
      - FAULT_TOKEN=dev-fault-token
      - POSTGRES_PASSWORD=cloudsentinel
      - DATABASE_URL=postgresql+psycopg://cloudsentinel:cloudsentinel@postgres:5432/cloudsentinel
generatorOptions:
  disableNameSuffixHash: true
