apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-api
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      containers:
        - name: analysis-api
          imagePullPolicy: IfNotPresent
          env:
            - name: ENVIRONMENT_NAME
              value: azure-dev
            - name: ENVIRONMENT_PROVIDER
              value: azure
            - name: FAULT_INJECTION_ENABLED
              value: "false"
