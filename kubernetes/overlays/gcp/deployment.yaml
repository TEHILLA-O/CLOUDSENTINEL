apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-api
spec:
  template:
    spec:
      containers:
        - name: analysis-api
          imagePullPolicy: IfNotPresent
          env:
            - name: ENVIRONMENT_NAME
              value: gcp-dev
            - name: ENVIRONMENT_PROVIDER
              value: gcp
            - name: FAULT_INJECTION_ENABLED
              value: "false"
